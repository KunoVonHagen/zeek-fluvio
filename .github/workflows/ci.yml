name: Zeek Plugin CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch: {}

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.ref }}

    - name: Install Runtime Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ wget curl tcpdump

    - name: Install Zeek build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bison cmake cppzmq-dev gcc g++ flex libfl-dev libpcap-dev libssl-dev make python3 python3-dev swig zlib1g-dev

    - name: Install Zeek
      run: |
        echo 'deb http://download.opensuse.org/repositories/security:/zeek/xUbuntu_24.04/ /' | sudo tee /etc/apt/sources.list.d/security:zeek.list
        curl -fsSL https://download.opensuse.org/repositories/security:zeek/xUbuntu_24.04/Release.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/security_zeek.gpg > /dev/null
        sudo apt-get update
        sudo apt-get install -y zeek zeek-core-dev
        echo "/opt/zeek/bin" >> $GITHUB_PATH

    - name: Install Fluvio Local Cluster
      run: |
        FLUVIO_VERSION=$(awk -F= '/^fluvio=/{print $2}' UPSTREAM_VERSIONS || true)
        curl -fsS https://raw.githubusercontent.com/fluvio-community/fluvio/master/install.sh | FLUVIO_VERSION=${FLUVIO_VERSION} FVM_VERSION=dev bash
        echo "$HOME/.fluvio/bin" >> $GITHUB_PATH

    - name: Start Fluvio Cluster
      run: |
        export PATH="$HOME/.fluvio/bin:$PATH"
        fluvio cluster start --local

    - name: Configure and Compile Plugin
      run: |
        export PATH="/opt/zeek/bin:$PATH"
        ./configure
        make -C build

    - name: Test Component Registry Load
      run: |
        export PATH="/opt/zeek/bin:$PATH"
        export ZEEK_PLUGIN_PATH=${GITHUB_WORKSPACE}/build
        # Verifies the plugin explicitly exists in Zeek runtime
        zeek -N Zeek::Fluvio

    - name: End-to-End Log Serialization Integration Test
      run: |
        # Utilize the uploaded static pre-recorded PCAP capture to avoid dynamic interface generation issues!
        bash ./tests/e2e.sh tests/Traces/ping.pcap
