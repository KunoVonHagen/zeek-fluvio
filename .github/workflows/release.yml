name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  issues: write

jobs:
  release_from_pr:
    if: "${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Validate branch name
        run: |
          set -euo pipefail
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          echo "Validating branch: $BRANCH_NAME"
          case "$BRANCH_NAME" in
            release/*|feature/*|patch/*) ;;
            *)
              echo "ERROR: branch '$BRANCH_NAME' does not match allowed prefixes (release/*, feature/*, patch/*)."
              exit 1
              ;;
          esac

      - name: Run tests (pre-release)
        run: |
          chmod +x tests/e2e.sh || true
          ./tests/e2e.sh tests/Traces/ping.pcap

      - name: Bump VERSION, commit and tag
        env:
          BRANCH_NAME: "${{ github.event.pull_request.head.ref }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GITHUB_REPOSITORY: "${{ github.repository }}"
          TARGET_BRANCH: "${{ github.event.pull_request.base.ref }}"
        run: |
          set -euo pipefail

          VERSION_FILE="$(pwd)/VERSION"
          if [ ! -f "$VERSION_FILE" ]; then
            echo "0.0.0" > "$VERSION_FILE"
          fi

          OLD_VERSION="$(tr -d ' \n\r' < "$VERSION_FILE")"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"

          case "$BRANCH_NAME" in
            release/*)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            feature/*)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch/*)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "ERROR: branch '$BRANCH_NAME' does not match allowed prefixes (release/*, feature/*, patch/*)."
              exit 1
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping version: $OLD_VERSION -> $NEW_VERSION"
          printf '%s\n' "$NEW_VERSION" > "$VERSION_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VERSION_FILE"
          git commit -m "ci: bump version to v$NEW_VERSION [skip ci]" || true

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin "refs/tags/v$NEW_VERSION"

      - name: Read VERSION file
        id: get_version
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release for tag
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  push_guard:
    if: "${{ github.event_name == 'push' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Exit if this is a VERSION-only commit from the bot
        run: |
          echo "Detected push event. Checking whether to act..."
          if [[ "${{ github.actor }}" == "github-actions[bot]" ]]; then
            echo "Push originated from github-actions bot; skipping release job to avoid loop."
            exit 0
          fi
          echo "Push actor: ${{ github.actor }}; continuing if this is a normal developer push."
